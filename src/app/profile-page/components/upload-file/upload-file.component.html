<div class="flex flex-col items-center justify-center gap-4">
  <nz-upload
    nzListType="picture-card"
    [nzFileList]="fileList"
    [nzBeforeUpload]="beforeUpload"
    (nzChange)="handleChange($event)"
    (nzRemove)="handleRemove()"
  >
    <div *ngIf="fileList.length === 0" class="flex flex-col items-center">
      <span nz-icon nzType="plus" class="text-2xl text-gray-600"></span>
      <div class="mt-2 text-sm text-gray-600">Choose image</div>
    </div>
  </nz-upload>

  <img
    *ngIf="previewImage"
    [src]="previewImage"
    alt="Avatar preview"
    class="h-40 w-40 rounded-lg border border-gray-200 object-cover"
  />

  <button
    *ngIf="selectedFile"
    nz-button
    nzType="primary"
    class="px-6"
    (click)="handleUpload()"
  >
    Upload
  </button>
</div>
