<div class="lg:col-span-7">
  <div class="relative mb-6">
    <h6 class="inline-block relative text-gray-500 uppercase pb-2">
      Need help?
    </h6>
    <h1 class="text-4xl font-bold">Send Us A Message</h1>
  </div>

  <form
    nz-form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmit()"
    class="space-y-4"
  >
    <!-- NAME & EMAIL ROW -->
    <div class="grid grid-cols-2 gap-4">
      <nz-form-item class="mb-0">
        <nz-form-control nzErrorTip="Name is required">
          <input nz-input formControlName="name" placeholder="Your name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="mb-0">
        <nz-form-control nzErrorTip="Valid email is required">
          <input nz-input formControlName="email" placeholder="Email" />
        </nz-form-control>
      </nz-form-item>
    </div>

    <!-- SUBJECT -->
    <nz-form-item class="mb-0">
      <nz-form-control>
        <textarea
          nz-input
          rows="4"
          formControlName="subject"
          placeholder="Subject"
        ></textarea>
      </nz-form-control>
    </nz-form-item>

    <!-- MESSAGE -->
    <nz-form-item class="mb-0">
      <nz-form-control>
        <textarea
          nz-input
          rows="5"
          formControlName="message"
          placeholder="Message"
        ></textarea>
      </nz-form-control>
    </nz-form-item>

    <button nz-button nzType="primary" class="px-10 h-12" type="submit">
      Send Message
    </button>
  </form>
</div>
