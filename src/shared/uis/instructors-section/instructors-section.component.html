<div class="py-16">
  <div class="max-w-7xl mx-auto px-4">
    <!-- TITLE -->

    <div class="text-center mb-12">
      <h1 class="text-3xl font-bold uppercase text-gray-600 mb-3">
        Meet Our Instructors
      </h1>

      <h5 class="text-xl text-gray-500">
        Our instructors are passionate about teaching and sharing their
        knowledge with you.
      </h5>
    </div>

    <!-- INSTRUCTOR GRID -->

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <nz-card
        *ngFor="let instructor of instructors"
        nzHoverable
        class="text-center shadow-lg rounded-xl overflow-hidden"
      >
        <!-- IMAGE -->

        <img
          nz-card-cover
          [src]="instructor.image"
          alt="Instructor"
          class="h-[400px] w-full object-cover"
        />

        <!-- CONTENT -->

        <nz-card-meta
          [nzTitle]="instructor.name"
          [nzDescription]="instructor.role"
        ></nz-card-meta>

        <!-- SOCIAL -->

        <div class="flex justify-center gap-3 mt-4 text-lg">
          <a routerLink="/" class="hover:text-blue-500">
            <span nz-icon nzType="twitter"></span>
          </a>

          <a routerLink="/" class="hover:text-blue-700">
            <span nz-icon nzType="facebook"></span>
          </a>

          <a routerLink="/" class="hover:text-blue-600">
            <span nz-icon nzType="linkedin"></span>
          </a>

          <a routerLink="/" class="hover:text-pink-500">
            <span nz-icon nzType="instagram"></span>
          </a>

          <a routerLink="/" class="hover:text-red-500">
            <span nz-icon nzType="youtube"></span>
          </a>
        </div>
      </nz-card>
    </div>
  </div>
</div>
