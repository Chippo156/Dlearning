<div class="max-w-6xl mx-auto px-4 py-10">
  <!-- Header -->
  <div class="text-center mb-10">
    <h2 class="text-4xl font-bold">Sign in</h2>
    <p class="mt-2 text-gray-500">
      Don't have an account?
      <a routerLink="/register" class="text-blue-600 hover:underline">
        Sign up
      </a>
    </p>
  </div>

  <div class="flex flex-col lg:flex-row justify-center gap-10 items-center">
    <!-- LOGIN FORM -->
    <div class="w-full max-w-md">
      <form
        [formGroup]="loginForm"
        (ngSubmit)="handleLogin()"
        class="space-y-4"
      >
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input
            type="email"
            placeholder="name@example.com"
            formControlName="email"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black"
            [class.border-red-500]="email?.invalid && email?.touched"
          />
          <div class="mt-1" *ngIf="email?.invalid && email?.touched">
            <p class="text-red-500 text-xs" *ngIf="email?.hasError('required')">
              Email is required
            </p>
            <p class="text-red-500 text-xs" *ngIf="email?.hasError('email')">
              Please enter a valid email
            </p>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input
            type="password"
            placeholder="Password"
            formControlName="password"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black"
            [class.border-red-500]="password?.invalid && password?.touched"
          />
          <div class="mt-1" *ngIf="password?.invalid && password?.touched">
            <p
              class="text-red-500 text-xs"
              *ngIf="password?.hasError('required')"
            >
              Password is required
            </p>
            <p
              class="text-red-500 text-xs"
              *ngIf="password?.hasError('minlength')"
            >
              Password must be at least 5 characters
            </p>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="flex justify-between items-center text-sm">
          <label class="flex items-center gap-2 text-gray-600">
            <input type="checkbox" class="border-gray-300" />
            Remember me
          </label>

          <a
            routerLink="/forgot-password"
            class="text-blue-600 hover:underline"
          >
            Forgot password?
          </a>
        </div>

        <!-- Button -->
        <button
          nz-button
          [nzLoading]="loading"
          type="submit"
          [disabled]="loginForm.invalid"
          class="w-full bg-black text-white rounded-md hover:bg-gray-800 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Log in
        </button>
      </form>
    </div>

    <!-- DIVIDER -->
    <div class="flex lg:flex-col items-center gap-4">
      <div class="hidden lg:block w-px h-32 bg-gray-300"></div>
      <div class="block lg:hidden h-px w-32 bg-gray-300"></div>
      <span class="text-gray-400 text-sm">or</span>
      <div class="hidden lg:block w-px h-32 bg-gray-300"></div>
      <div class="block lg:hidden h-px w-32 bg-gray-300"></div>
    </div>

    <!-- SOCIAL LOGIN -->
    <div class="w-full max-w-md flex flex-col gap-3">
      <button
        class="border border-gray-300 flex items-center px-4 py-3 rounded-md hover:bg-gray-50 transition"
        (click)="handleGoogleLogin()"
      >
        <i class="bi bi-google text-red-500"></i>
        <span class="flex-1 text-center">Continue with Google</span>
      </button>

      <button
        class="border border-gray-300 flex items-center px-4 py-3 rounded-md hover:bg-gray-50 transition"
        (click)="handleFacebookLogin()"
      >
        <i class="bi bi-facebook text-blue-600"></i>
        <span class="flex-1 text-center">Continue with Facebook</span>
      </button>

      <button
        class="border border-gray-300 flex items-center px-4 py-3 rounded-md hover:bg-gray-50 transition"
        (click)="handleGithubLogin()"
      >
        <i class="bi bi-github"></i>
        <span class="flex-1 text-center">Continue with Github</span>
      </button>
    </div>
  </div>
</div>
