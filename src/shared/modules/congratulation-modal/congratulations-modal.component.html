<div class="text-center relative p-6">
  <!-- Confetti -->
  <div #confettiContainer class="absolute inset-0 pointer-events-none"></div>

  <h1 class="text-3xl font-bold text-green-500 mb-2">🎉 Congratulations!</h1>

  <p class="text-gray-500 mb-6">You've successfully completed the course!</p>

  <!-- Avatar -->
  <div class="flex justify-center mb-4">
    <div
      class="w-24 h-24 rounded-full overflow-hidden border-4 border-green-400 shadow"
    >
      <img [src]="avatar" class="w-full h-full object-cover" />
    </div>
  </div>

  <h2 class="text-xl font-semibold">
    {{ username }}
  </h2>

  <p class="text-gray-500 mt-2 mb-6">
    You are now certified! Keep up the great work and continue learning!
  </p>

  <button nz-button nzType="primary" nzSize="large" (click)="close()">
    View Certificate
  </button>
</div>
