<nav class="flex items-center justify-center gap-6 relative">
  <a
    *ngFor="let menu of menus"
    nz-button
    nzType="link"
    [routerLink]="menu.path"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: menu.path === '/' }"
    class="nav-link text-gray-600 text-base font-medium px-2 py-1 transition-all duration-300"
  >
    {{ menu.label }}
  </a>
</nav>
