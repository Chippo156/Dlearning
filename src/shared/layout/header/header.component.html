<header class="w-full shadow bg-white">
  <div
    class="max-w-[1400px] mx-auto flex items-center justify-between px-6 py-3"
  >
    <!-- LOGO -->
    <a
      routerLink="/home"
      class="flex items-center gap-2 text-xl font-bold text-blue-600"
    >
      <i nz-icon nzType="book" nzTheme="outline"></i>
      Chippo Learning
    </a>

    <!-- MENU -->
    <!-- <app-navigation-menu class="hidden lg:flex"></app-navigation-menu> -->

    <!-- RIGHT SIDE -->
    <div class="flex items-center gap-10">
      <!-- POINTS -->
      <div class="flex items-center gap-1 text-yellow-500 font-semibold">
        <i nz-icon nzType="dollar-circle"></i>
        {{ points }}
      </div>

      <!-- NOTIFICATION -->
      <a nz-dropdown nzTrigger="click" [nzDropdownMenu]="notification">
        <nz-badge [nzCount]="unreadCount">
          <i nz-icon nzType="bell"></i>
        </nz-badge>
      </a>
      <nz-dropdown-menu #notification="nzDropdownMenu">
        <ul nz-menu>
          <li
            nz-menu-item
            *ngFor="let noti of notifications"
            (click)="markAsRead(noti.id)"
          >
            {{ noti.message }}
          </li>
        </ul>
      </nz-dropdown-menu>

      <!-- FAVOURITE -->
      <button nz-button nzType="text">
        <i nz-icon nzType="heart"></i>
      </button>

      <!-- PROFILE -->
      <a
        nz-dropdown
        nzTrigger="click"
        [nzDropdownMenu]="profile"
        nzType="text"
        class="flex items-center gap-2"
      >
        <nz-avatar [nzSrc]="avatar" nzSize="default"></nz-avatar>
      </a>
      <nz-dropdown-menu #profile="nzDropdownMenu">
        <ul nz-menu>
          <li nz-menu-item routerLink="/profile">
            <i nz-icon nzType="user"></i>
            Profile
          </li>

          <li nz-menu-item routerLink="/settings">
            <i nz-icon nzType="setting"></i>
            Settings
          </li>

          <li nz-menu-divider></li>

          <li nz-menu-item (click)="handleLogout()">
            <i nz-icon nzType="logout"></i>
            Logout
          </li>
        </ul>
      </nz-dropdown-menu>
    </div>
  </div>
</header>
