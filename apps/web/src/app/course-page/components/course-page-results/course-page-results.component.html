<nz-content class="bg-white rounded-3xl shadow-2xl p-6 text-slate-900">
  <div
    *ngIf="!paginationResponse.result || paginationResponse.result.length === 0"
    class="flex flex-col items-center justify-center py-16"
  >
    <svg
      class="w-24 h-24 text-slate-300 mb-4"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 6.253v13m0-13C6.5 6.253 2 10.998 2 17s4.5 10.747 10 10.747c5.5 0 10-4.998 10-10.747C22 11.001 17.5 6.253 12 6.253z"
      ></path>
    </svg>
    <p class="text-slate-600 text-lg font-semibold">No courses found</p>
    <p class="text-slate-400 text-sm">Try adjusting your search criteria</p>
  </div>

  <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
    <app-course-list-card
      *ngFor="let course of paginationResponse.result"
      [course]="course"
      [showPoints]="true"
      (viewDetail)="onViewDetail($event)"
      (addFavourite)="onAddFavourite($event)"
    ></app-course-list-card>
  </div>

  <div
    class="flex justify-center items-center mt-12 pt-8 border-t border-gray-200"
  >
    <nz-pagination
      [nzTotal]="paginationResponse.totalElements"
      [(nzPageIndex)]="paginationResponse.currentPage"
      [nzPageSize]="paginationResponse.pageSize"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true"
      [nzPageSizeOptions]="[8, 12, 16, 20]"
      (nzPageIndexChange)="onPageChange($event)"
      nzSize="default"
    ></nz-pagination>
  </div>
</nz-content>
