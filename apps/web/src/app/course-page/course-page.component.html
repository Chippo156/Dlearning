<app-get-courses-elastic-search-ux
  #ux
  [init]="true"
  [pagination]="pagination"
  [keyword]="keyword"
  [searchSpecification]="searchSpecification"
  [sortBy]="sortBy"
  (onSuccess)="onCoursesLoaded($event)"
></app-get-courses-elastic-search-ux>
<div
  @pageAnimation
  class="min-h-screen bg-slate-950 text-slate-100 flex justify-center relative overflow-hidden"
>
  <div
    class="pointer-events-none absolute -top-40 -left-40 h-[420px] w-[420px] rounded-full bg-cyan-500/20 blur-[120px]"
  ></div>
  <div
    class="pointer-events-none absolute bottom-0 -right-24 h-[520px] w-[520px] rounded-full bg-amber-400/20 blur-[140px]"
  ></div>

  <div class="flex h-screen w-full max-w-[1400px]">
    <!-- LEFT SIDEBAR - SEARCH/FILTER -->
    <app-search-course
      #searchCourse
      class="w-1/4 flex-shrink-0 bg-white text-slate-900"
      [searchControl]="searchControl"
      (filtersChange)="onFilterChanged()"
    ></app-search-course>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-1 overflow-y-auto" *ngIf="paginationResponse">
      <div class="max-w-6xl mx-auto px-4 py-8">
        <app-course-page-header
          [totalElements]="paginationResponse.totalElements"
          [keyword]="keyword"
          [option]="option"
        ></app-course-page-header>

        <app-course-page-sort-bar
          [totalElements]="paginationResponse.totalElements"
          [option]="option"
          (optionChange)="setOption($event)"
        ></app-course-page-sort-bar>

        <app-course-page-results
          [paginationResponse]="paginationResponse"
          (viewDetail)="viewCourseDetail($event)"
          (addFavourite)="handleAddFavourite($event)"
          (pageChange)="setCurrentPage($event)"
        ></app-course-page-results>
      </div>
    </div>
  </div>
</div>
