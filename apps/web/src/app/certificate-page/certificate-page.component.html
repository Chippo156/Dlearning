<div class="max-w-6xl mx-auto py-10">
  <h1 class="text-center text-3xl font-semibold text-gray-700 mb-8">
    My Certificates
  </h1>

  <!-- Loading -->

  <div *ngIf="loading" class="text-center">Loading certificates...</div>

  <!-- Error -->

  <div *ngIf="httpError" class="text-red-500 text-center">
    {{ httpError }}
  </div>

  <!-- Empty -->

  <div
    *ngIf="!loading && certificates.length === 0"
    class="text-center text-gray-500"
  >
    No certificates available.
  </div>

  <!-- Certificate list -->

  <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    <app-certificate-card
      *ngFor="let cert of certificates"
      [certificate]="cert"
      (download)="handleDownload($event)"
    ></app-certificate-card>
  </div>
</div>
