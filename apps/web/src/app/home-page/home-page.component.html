<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  .home-page {
    font-family: 'Space Grotesk', sans-serif;
    background: #f6f4ef;
  }

  .home-page .display {
    font-family: 'Fraunces', serif;
  }
</style>

<app-get-active-advertisements-ux
  init
  #getActiveAdsUx
  (success)="showPromoModal = true"
></app-get-active-advertisements-ux>
<div class="content-page home-page text-slate-900">
  <app-promo-modal
    *ngIf="showPromoModal"
    [loading]="(getActiveAdsUx.loading$ | async) ?? false"
    [visible]="showPromoModal"
    [ads]="(getActiveAdsUx?.result$ | async) ?? []"
    (close)="closePromoModal()"
  >
  </app-promo-modal>

  <app-education-highlights></app-education-highlights>

  <app-intro-section></app-intro-section>

  <app-our-courses> </app-our-courses>

  <app-instructors-section></app-instructors-section>

  <app-feedback-section></app-feedback-section>

  <div class="py-20 bg-[#f7f3ee]">
    <div class="max-w-7xl mx-auto px-4">
      <div class="grid md:grid-cols-2 gap-10 items-center">
        <app-info-contact></app-info-contact>

        <app-contact-section></app-contact-section>
      </div>
    </div>
  </div>
</div>
