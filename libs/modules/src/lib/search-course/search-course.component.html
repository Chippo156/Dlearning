<aside class="search-panel md:h-screen md:sticky md:top-0">
  <div class="search-panel__glow"></div>

  <div class="search-panel__header">
    <div class="search-panel__title-wrap">
      <span class="search-panel__icon" nz-icon nzType="filter"></span>
      <div>
        <p class="search-panel__title">Course filters</p>
        <p class="search-panel__subtitle">Refine results faster</p>
      </div>
    </div>

    <div class="search-panel__actions">
      <span class="search-panel__count">{{ countSearch }}</span>
      <button
        nz-button
        nzType="default"
        nzSize="small"
        class="search-panel__clear"
        (click)="clearFilter()"
      >
        Clear
      </button>
    </div>
  </div>

  <section class="filter-card">
    <p class="filter-card__title">Search</p>
    <div class="filter-input-wrap">
      <span nz-icon nzType="search" class="filter-input__icon"></span>
      <input
        nz-input
        placeholder="Search courses, instructors, topics..."
        class="filter-input"
        [formControl]="searchControl"
      />
    </div>
  </section>

  <section class="filter-card">
    <div class="filter-card__heading">
      <p class="filter-card__title">Level</p>
      <span class="filter-card__meta">{{ level.length }} selected</span>
    </div>

    <div class="filter-list">
      <label
        class="filter-list__item"
        nz-checkbox
        *ngFor="let lvl of levels"
        [ngModel]="level.includes(lvl)"
        (ngModelChange)="toggleLevel(lvl)"
      >
        {{ lvl | titlecase }}
      </label>
    </div>
  </section>

  <section class="filter-card">
    <div class="filter-card__heading">
      <p class="filter-card__title">Type</p>
      <span class="filter-card__meta">{{ type.length }} selected</span>
    </div>

    <div class="filter-list">
      <label
        class="filter-list__item"
        nz-checkbox
        *ngFor="let t of types"
        [ngModel]="type.includes(t)"
        (ngModelChange)="toggleType(t)"
      >
        {{ t }}
      </label>
    </div>
  </section>

  <section class="filter-card filter-card--duration">
    <div class="filter-card__heading">
      <p class="filter-card__title">Duration</p>
      <span class="filter-card__meta" *ngIf="duration">1 selected</span>
    </div>

    <nz-radio-group
      [(ngModel)]="duration"
      (ngModelChange)="onDurationChange($event)"
      class="duration-group"
    >
      <label
        nz-radio
        *ngFor="let d of durations"
        [nzValue]="d.value"
        class="duration-option"
      >
        {{ d.label }}
      </label>
    </nz-radio-group>
  </section>
</aside>
