<div class="mb-10">
  <div
    class="inline-flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 text-xs uppercase tracking-[0.2em] text-cyan-200"
  >
    Browse Catalog
  </div>

  <h1 class="mt-4 text-4xl md:text-5xl font-semibold text-white">
    Build skills with courses that feel like a launchpad.
  </h1>

  <p class="mt-3 text-lg text-slate-300 max-w-2xl">
    Discover courses tailored to your learning goals, from quick wins to deep
    mastery tracks.
  </p>

  <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="rounded-2xl bg-white/10 border border-white/10 p-4">
      <p class="text-xs uppercase tracking-[0.18em] text-slate-300">
        Total Courses
      </p>
      <p class="mt-2 text-2xl font-semibold text-white">{{ totalElements }}</p>
    </div>

    <div class="rounded-2xl bg-white/10 border border-white/10 p-4">
      <p class="text-xs uppercase tracking-[0.18em] text-slate-300">
        Current Filter
      </p>
      <p class="mt-2 text-base font-semibold text-white">
        {{ keyword || 'All topics' }}
      </p>
    </div>

    <div class="rounded-2xl bg-white/10 border border-white/10 p-4">
      <p class="text-xs uppercase tracking-[0.18em] text-slate-300">
        Sorted By
      </p>
      <p class="mt-2 text-base font-semibold text-white">{{ sortLabel }}</p>
    </div>
  </div>
</div>
