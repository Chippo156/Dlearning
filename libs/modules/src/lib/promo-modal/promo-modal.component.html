<nz-modal
  *ngIf="ads?.length"
  [nzOkLoading]="loading"
  [(nzVisible)]="visible"
  (nzOnCancel)="close.emit()"
  [nzFooter]="null"
  [nzWidth]="520"
  nzCentered
  [nzBodyStyle]="{ padding: '0' }"
>
  <ng-container *nzModalContent>
    <div class="relative w-full bg-white rounded-3xl overflow-hidden">
      <!-- LEFT BUTTON -->

      <button
        nz-button
        nzShape="circle"
        class="absolute left-3 top-1/2 -translate-y-1/2 z-20 shadow-lg"
        (click)="prev()"
      >
        <span nz-icon nzType="left"></span>
      </button>

      <!-- CAROUSEL -->

      <nz-carousel *ngIf="ads?.length" #carousel nzAutoPlay nzEffect="scrollx">
        <div nz-carousel-content *ngFor="let ad of ads">
          <div class="flex flex-col items-center text-center px-6 py-8">
            <div
              class="mb-4 inline-flex items-center gap-2 rounded-full bg-slate-900 px-4 py-1 text-xs uppercase tracking-[0.25em] text-white"
            >
              Spotlight
            </div>
            <!-- IMAGE -->

            <div class="w-full flex justify-center mb-4">
              <img
                [src]="ad.image"
                class="max-h-[220px] w-auto object-contain rounded-md shadow"
              />
            </div>

            <!-- TITLE -->

            <h3 class="text-2xl font-semibold text-slate-900 mb-2">
              {{ ad.title }}
            </h3>

            <!-- DESCRIPTION -->

            <p class="text-slate-600 text-sm mb-3 line-clamp-2">
              {{ ad.description }}
            </p>

            <!-- PRICE -->

            <!-- DATE -->

            <p class="text-xs text-slate-400 mb-5">
              {{ ad.startDate }} - {{ ad.endDate }}
            </p>

            <!-- BUTTON -->

            <a
              nz-button
              nzType="primary"
              class="px-8 rounded-full"
              [href]="ad.link"
              target="_blank"
            >
              Enroll Now
            </a>
          </div>
        </div>
      </nz-carousel>

      <!-- RIGHT BUTTON -->

      <button
        nz-button
        nzShape="circle"
        class="absolute right-3 top-1/2 -translate-y-1/2 z-20 shadow-lg"
        (click)="next()"
      >
        <span nz-icon nzType="right"></span>
      </button>
    </div>
  </ng-container>
</nz-modal>
