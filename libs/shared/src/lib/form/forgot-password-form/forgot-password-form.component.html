<section class="forgot-shell">
  <div class="forgot-card">
    <p class="forgot-kicker">Account Recovery</p>
    <h2>Forgot your password?</h2>
    <p class="forgot-subtitle">
      Enter your email and we will send a one-time code to verify your identity.
    </p>

    <form
      nz-form
      nzLayout="vertical"
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="submit()"
      class="forgot-form"
    >
      <nz-form-item class="form-item">
        <nz-form-label [nzRequired]="true">Email</nz-form-label>
        <nz-form-control [nzErrorTip]="emailErrorTpl">
          <input
            nz-input
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            class="forgot-input"
          />
        </nz-form-control>
      </nz-form-item>

      <ng-template #emailErrorTpl>
        <span *ngIf="email?.hasError('required')">Email is required</span>
        <span *ngIf="email?.hasError('email')">Please enter a valid email</span>
      </ng-template>

      <button
        nz-button
        nzType="primary"
        [nzLoading]="loading"
        class="forgot-submit-btn"
      >
        Send recovery code
      </button>

      <p class="forgot-footer-text">
        Remembered your password?
        <a routerLink="/login">Back to sign in</a>
      </p>
    </form>
  </div>
</section>
