<div class="max-w-md mx-auto mt-10">
  <div class="text-center mb-8">
    <h2 class="text-4xl font-bold text-gray-800">Create Account</h2>

    <p class="text-gray-500 mt-2">
      Already have an account?
      <a
        routerLink="/login"
        class="text-blue-500 hover:underline font-semibold"
      >
        Sign in
      </a>
    </p>
  </div>
</div>

<app-register-form
  *ngIf="!isOtpSent"
  (registerSubmit)="formSubmit($event)"
  [loading]="loading"
></app-register-form>

<app-otp-form
  *ngIf="isOtpSent"
  (otpSubmit)="registerUx.register(formValue, $event)"
  [loading]="registerUx.loading"
></app-otp-form>

<app-register-ux
  #registerUx
  (registerSuccessEvent)="onRegisterSuccess()"
></app-register-ux>
