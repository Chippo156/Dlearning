<div class="space-y-6">
  <div
    *ngFor="let contact of contacts"
    class="flex items-center gap-6 rounded-2xl border border-white bg-white p-5 shadow-lg"
  >
    <!-- ICON -->

    <div
      class="w-16 h-16 rounded-2xl flex items-center justify-center text-white"
      [ngClass]="contact.color"
    >
      <span nz-icon [nzType]="contact.icon"></span>
    </div>

    <!-- TEXT -->

    <div>
      <h4 class="font-semibold text-lg text-slate-900">
        {{ contact.title }}
      </h4>

      <p class="text-slate-600">
        {{ contact.value }}
      </p>
    </div>
  </div>
</div>
