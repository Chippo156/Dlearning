<app-get-courses-caching-ux
  #ux
  [init]="true"
  [pagination]="pagination"
  (onSuccess)="onGetCoursesSuccess($event)"
></app-get-courses-caching-ux>
<div class="relative bg-[#0b1020] py-20 overflow-hidden">
  <div
    class="absolute -top-20 -left-24 h-72 w-72 rounded-full bg-cyan-400/20 blur-[110px]"
  ></div>
  <div
    class="absolute bottom-0 -right-24 h-96 w-96 rounded-full bg-amber-400/20 blur-[140px]"
  ></div>

  <div class="relative max-w-7xl mx-auto px-6">
    <!-- Section Title -->
    <div class="text-center mb-14">
      <div
        class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs uppercase tracking-[0.3em] text-cyan-200"
      >
        Our Courses
      </div>

      <h1 class="display text-4xl md:text-5xl font-semibold text-white mt-4">
        Fresh releases curated for real-world impact.
      </h1>

      <p class="text-slate-300 mt-4 max-w-2xl mx-auto">
        Discover high quality courses designed by industry experts and move from
        concepts to execution faster.
      </p>
    </div>

    <!-- Course Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
      <app-course-list-card
        *ngFor="let course of paginationRes?.result"
        [course]="course"
        [showTypeBadge]="true"
        [showPoints]="false"
        (viewDetail)="handleDetailCourse($event)"
        (addFavourite)="handleAddFavourite($event)"
      ></app-course-list-card>
    </div>

    <!-- Load More -->
    <div class="flex justify-center mt-14">
      <button
        *ngIf="hasMore"
        nz-button
        nzType="primary"
        class="px-10 py-2 rounded-full shadow-lg"
        (click)="loadMoreCourses()"
      >
        Show More
      </button>

      <p *ngIf="!hasMore" class="text-gray-400 text-lg">All courses loaded</p>
    </div>
  </div>
</div>
