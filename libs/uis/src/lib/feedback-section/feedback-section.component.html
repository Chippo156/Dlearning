<div
  class="py-20 bg-gradient-to-br from-slate-950 via-slate-900 to-[#111827] my-24 text-white"
>
  <div class="max-w-7xl mx-auto px-4">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <!-- LEFT CONTENT -->

      <div>
        <div
          class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs uppercase tracking-[0.3em] text-cyan-200"
        >
          Feedback
        </div>

        <h1 class="display text-white text-4xl md:text-5xl font-semibold mt-5">
          Students who finished with confidence.
        </h1>

        <p class="text-slate-300 mt-4 max-w-xl">
          Our community grows because the learning experience feels supportive,
          precise, and personal. Here is what learners say after graduation.
        </p>
      </div>

      <!-- CAROUSEL -->

      <div
        class="bg-white/10 rounded-3xl shadow-2xl p-8 border border-white/10 backdrop-blur"
      >
        <nz-carousel nzAutoPlay nzAutoPlaySpeed="3000">
          <div nz-carousel-content *ngFor="let feedback of feedbacks">
            <div class="text-center">
              <span nz-icon class="text-3xl text-cyan-300"></span>

              <div class="flex items-center gap-4 mt-6">
                <img
                  [src]="feedback.image"
                  class="w-16 h-16 rounded-2xl object-cover"
                />

                <div class="text-left">
                  <h4 class="font-semibold">
                    {{ feedback.name }}
                  </h4>

                  <span class="text-slate-300 text-sm">
                    {{ feedback.role }}
                  </span>
                </div>
              </div>

              <p class="text-slate-200 mt-4">
                {{ feedback.message }}
              </p>

              <div class="flex justify-end mt-4">
                <span nz-icon class="text-3xl text-cyan-300"></span>
              </div>
            </div>
          </div>
        </nz-carousel>
      </div>
    </div>
  </div>
</div>
